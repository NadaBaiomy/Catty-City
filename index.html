const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hex2rgb=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const easeOutBack=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const easeOutCubic=x=>1-Math.pow(1-x,3);
function circRect(cx,cy,r,x,y,w,h){const nx=clamp(cx,x,x+w),ny=clamp(cy,y,y+h);const dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r;}
function cham(x,y,w,h,c){ctx.beginPath();ctx.moveTo(x+c,y);ctx.lineTo(x+w-c,y);ctx.lineTo(x+w,y+c);ctx.lineTo(x+w,y+h-c);ctx.lineTo(x+w-c,y+h);ctx.lineTo(x+c,y+h);ctx.lineTo(x,y+h-c);ctx.lineTo(x,y+c);ctx.closePath();}

   o.type=type||'square'; o.frequency.setValueAtTime(f0,t0);

   g.gain.setValueAtTime(vol||.08,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);

function spr(rows,pal,s){ s=s||PIX;
 const w=Math.max.apply(null,rows.map(r=>r.length)),h=rows.length;
 const c=document.createElement('canvas'); c.width=w*s; c.height=h*s;
 const g=c.getContext('2d');
 rows.forEach((r,y)=>{ for(let x=0;x<r.length;x++){ const col=pal[r[x]];
   if(col){ g.fillStyle=col; g.fillRect(x*s,y*s,s,s); } } });
 return c;
}
function flipH(c){const n=document.createElement('canvas');n.width=c.width;n.height=c.height;
 const g=n.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return n;}

   for(let j=0;j<3;j++)live[key][j]=live[key][j]+(T[key][j]-live[key][j])*k; });
}

function burst(x,y,n,cols,sp,g,life){ for(let i=0;i<n;i++){
 const a=rand(0,TAU),v=rand(sp*.3,sp);
 parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:g,life:rand(life*.6,life),t:0,
   c:pick(cols),s:randi(2,5)}); } }
function popup(s,x,y,c){ pops.push({s,x,y,t:1,c:c||'#fff'}); }
function updateParticles(dt){
 for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.t+=dt;
   p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt;
   if(p.t>p.life)parts.splice(i,1); }
 if(parts.length>340)parts.splice(0,parts.length-340);
 for(let i=pops.length-1;i>=0;i--){ const p=pops[i]; p.t-=dt; p.y-=44*dt; if(p.t<=0)pops.splice(i,1); }
}
function drawParticles(){ parts.forEach(p=>{ ctx.save(); ctx.globalAlpha=Math.max(0,1-p.t/p.life);
 ctx.fillStyle=p.c; ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); ctx.restore(); }); }

function spacing(){ const s=theme.speed*(1+loopN*.16); return clamp(240+s*.52,270,430); }
function spawnPairAt(x){
 const g=clamp(theme.gap-loopN*4,150,230);
 const minY=g/2+80,maxY=GROUND-g/2-80;
 const gy=clamp((pairs.length?pairs[pairs.length-1].gy:H/2)+rand(-160,160),minY,maxY);
 const w=randi(64,88);
 const pal=Object.assign({},pick(theme.pals),{lit:theme.lit,litCols:theme.litCols,round:theme.roundWin});
 const p={x,w,gy,g,pal,seed:randi(1,1e9),scored:false,
   laundry:levelNum>=2&&Math.random()<.22,dog:null,pot:null,basket:null};
 const hs=theme.hazards.filter(h=>h==='dog'||h==='pot'||h==='basket');
 if(score>=6&&hs.length&&Math.random()<.33){ const h=pick(hs);
   if(h==='dog')p.dog={ox:rand(.2,.55),barkT:0,barked:false};
   if(h==='pot')p.pot={ox:rand(.25,.75),wy:0,wx:0,vy:0,dropped:false,dead:false};
   if(h==='basket')p.basket={ox:rand(.2,.8),wy:0,wx:0,vy:0,rot:0,dropped:false,dead:false};
 }
 if(p.pot)p.pot.wy=(gy-g/2)-16;
 if(p.basket)p.basket.wy=(gy-g/2)-6;
 pairs.push(p);
 const r=Math.random();
 if(r<.22)pickups.push({kind:'fish',x:x+w/2,y:gy,t:0});
 else if(r<.32)for(let i=0;i<3;i++)pickups.push({kind:'fish',x:x+w/2-24+i*26,y:gy+(i===1?26:-22),t:i*.2});
 else if(r<.48){ const kind=wpick([['heart',.15],['bolt',.15],['wing',.15],['magnet',.1],['star',.15],['clock',.15],['milk',.15]]);
   pickups.push({kind,x:x+w/2,y:gy,t:0}); }
}
function ensurePairs(){ let lx=pairs.length?pairs[pairs.length-1].x:W+280;
 while(lx<W+320){ lx+=spacing(); spawnPairAt(lx); } }

function bld(x,y,w,h,pal,isTop,seed,t){
 if(h<10)return;
 const rng=mulberry32(seed);
 ctx.fillStyle=pal.body; ctx.fillRect(x,y,w,h);
 ctx.fillStyle=pal.shade; ctx.fillRect(x+w-7,y,7,h);
 ctx.fillStyle=pal.trim; ctx.fillRect(x+3,y,3,h);
 ctx.fillStyle=pal.out; ctx.fillRect(x-3,y,3,h); ctx.fillRect(x+w,y,3,h);
 const stepX=21,stepY=27,ww=12,wh=15;
 const cols=Math.max(1,Math.floor((w-10)/stepX));
 const rows=Math.max(1,Math.floor((h-22)/stepY));
 const mx=x+Math.floor((w-cols*ww-(cols-1)*(stepX-ww))/2)+3;
 const my0=isTop?y+10:y+12;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
   const wx=mx+c*stepX,wy=my0+r*stepY;
   if(wy+wh>y+h-4)continue;
   const lit=rng()<pal.lit;
   const col=lit?pal.litCols[(r*3+c+seed)%pal.litCols.length]:pal.win;
   ctx.fillStyle=pal.out; ctx.fillRect(wx-2,wy-2,ww+4,wh+4);
   ctx.fillStyle=col;
   if(pal.round){ctx.fillRect(wx,wy+2,ww,wh-4);ctx.fillRect(wx+2,wy,ww-4,wh);}
   else ctx.fillRect(wx,wy,ww,wh);
   if(lit){ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(wx+2,wy+2,4,4);}
 }
 const ey=isTop?y+h:y-9;
 ctx.fillStyle=pal.shade; ctx.fillRect(x-6,ey,w+12,9);
 ctx.fillStyle=pal.out;
 ctx.fillRect(x-6,isTop?ey+9:ey-3,w+12,3);
 ctx.fillRect(x-6,ey,3,9); ctx.fillRect(x+w+3,ey,3,9);
 if(!isTop){
   if(theme.gtype==='snow'){ctx.fillStyle='#f4f9fd';ctx.fillRect(x-6,ey-3,w+12,4);}
   const pr=rng();
   if(pr<.3){ ctx.fillStyle=pal.out; ctx.fillRect(x+w*.16,ey-24,22,15);
     ctx.fillStyle=pal.trim; ctx.fillRect(x+w*.16+3,ey-21,16,9);
     ctx.fillStyle=pal.out; ctx.fillRect(x+w*.16+3,ey-9,3,9); ctx.fillRect(x+w*.16+16,ey-9,3,9);
   }else if(pr<.55){ ctx.fillStyle=pal.out; ctx.fillRect(x+w*.68,ey-30,3,30);
     ctx.fillStyle=Math.sin(t*4+seed)>0?'#ff5d5d':pal.shade;
     ctx.fillRect(x+w*.68-3,ey-36,9,6);
   }else if(pr<.8){ ctx.fillStyle=pal.out; ctx.fillRect(x+w*.4,ey-13,17,11);
     ctx.fillStyle='#9aa3b0'; ctx.fillRect(x+w*.4+3,ey-10,11,5);
   }
 }else{
   ctx.fillStyle=pal.shade;
   ctx.fillRect(x+w/2-13,y+h+9,26,7);
   ctx.fillRect(x+w/2-8,y+h+16,16,7);
   ctx.fillRect(x+w/2-3,y+h+23,6,9);
   ctx.fillStyle=Math.sin(t*5+seed)>0?'#ffd84d':pal.out;
   ctx.fillRect(x+w/2-4,y+h+32,8,6);
 }
}
function drawPair(p,t){
 const gt=p.gy-p.g/2, gb=p.gy+p.g/2, x=Math.round(p.x);
 bld(x,0,p.w,gt,p.pal,true,p.seed+1013,t);
 bld(x,gb,p.w,GROUND-gb,p.pal,false,p.seed,t);
 if(p.laundry){ const cols=['#ff6b6b','#6bc1ff','#ffd84d','#7ddb8a','#ff9db1'];
   for(let i=0;i<3;i++){ const cx=x+p.w*(.2+.3*i);
     const sw=Math.sin(t*2+i*1.4+(p.seed%10))*.14;
     ctx.save(); ctx.translate(cx,gt); ctx.rotate(sw);
     ctx.fillStyle='#3a3a4a'; ctx.fillRect(-11,-4,22,4);
     ctx.fillStyle=cols[(p.seed+i)%5]; ctx.fillRect(-9,0,18,24);
     ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(-9,0,18,4);
     ctx.fillStyle='#3a3a4a'; ctx.fillRect(-9,-6,3,5); ctx.fillRect(6,-6,3,5);
     ctx.restore(); } }
 if(p.dog){ const d=p.dog, dx=x+p.w*d.ox, dy=gb;
   let off=0; if(d.barkT>0)off=-Math.sin((1-d.barkT/.6)*Math.PI)*9;
   ctx.fillStyle=p.pal.out; ctx.fillRect(dx-25,dy-9,50,3);
   for(let i=0;i<5;i++)ctx.fillRect(dx-25+i*11,dy-9,3,10);
   ctx.drawImage(SPR.dog,dx-19,dy-31+off,39,30);
   if(d.barkT>.35)dtext('!',dx+24,dy-40+off,{f:'px',size:11,color:'#ff5d5d'}); }
 if(p.pot&&!p.pot.dead){ const pt=p.pot;
   ctx.drawImage(SPR.pot,pt.wx-15,pt.wy-14,30,27); }
 if(p.basket&&!p.basket.dead){ const bk=p.basket;
   ctx.save(); ctx.translate(bk.wx,bk.wy); ctx.rotate(bk.rot);
   ctx.drawImage(SPR.basket,-18,-14,36,27); ctx.restore(); }
}

 cat.vy=JUMP*ch.jump*wmul; cat.q=.22; cat.flap+=1.5; jumpedOnce=true;

 state=ST.DYING; deathT=0; cat.vy=-240; cat.landed=false; rushT=0; slowmo=0;

function hitObs(p,kind,f){
 const ch=curChar();
 if(ch.id==='ghost'&&cat.phase>0){ cat.phase--; cat.inv=1.3;
   SFX.boo(); popup('عبور شبحي! 👻',cat.x,cat.y-46,'#cfe0f2');
   burst(cat.x,cat.y,14,['#cfe0f2','#9fb4d4'],130,80,.7);
   if(f)f.dead=true;
   if(kind==='pot'&&p&&p.pot)p.pot.dead=true;
   if(kind==='basket'&&p&&p.basket)p.basket.dead=true;
   return; }
 if(cat.shield){ cat.shield=false; cat.inv=1.5;
   SFX.shield(); popup('الدرع اتكسر! 💥',cat.x,cat.y-44,'#ff9db1');
   burst(cat.x,cat.y,14,['#ff9db1','#fff3dd'],150,300,.6);
   if(f)f.dead=true;
   if(kind==='pot'&&p&&p.pot)p.pot.dead=true;
   if(kind==='basket'&&p&&p.basket)p.basket.dead=true;
   return; }
 die();
}
function collide(){
 const ch=curChar(), cx=cat.x, cy=cat.y, r=ch.r;
 // الأرض
 if(cy+r>GROUND){
   if(cat.star>0){cat.y=GROUND-r;cat.vy=-380;burst(cx,GROUND-6,10,RAINBOW,140,300,.6);return;}
   if(ch.id==='ghost'&&cat.phase>0){cat.phase--;cat.inv=1.2;cat.y=GROUND-r;cat.vy=-330;
     SFX.boo();popup('عبور شبحي! 👻',cat.x,cat.y-46,'#cfe0f2');return;}
   die();return; }
 if(cy<18){cat.y=18;cat.vy=Math.max(cat.vy,0);}
 if(cat.star>0){ // النجمة: تعدي من كل حاجة وتكسر الطايرات
   for(const f of flyers){ if(f.dead)continue;
     if(dist2(cx,cy,f.x,f.y)<(r+18)*(r+18)){ f.dead=true; score+=2;
       popup('+2 💥',f.x,f.y,'#c79dff'); burst(f.x,f.y,12,['#c79dff','#ffd84d','#fff'],150,250,.6); SFX.smash(); } }
   for(const p of pairs){
     if(p.pot&&!p.pot.dead&&dist2(cx,cy,p.pot.wx,p.pot.wy)<(r+13)*(r+13)){p.pot.dead=true;score+=2;popup('+2 💥',p.pot.wx,p.pot.wy,'#c79dff');burst(p.pot.wx,p.pot.wy,10,['#c96a3b','#59b34a'],130,300,.5);SFX.smash();}
     if(p.basket&&!p.basket.dead&&dist2(cx,cy,p.basket.wx,p.basket.wy)<(r+15)*(r+15)){p.basket.dead=true;score+=2;popup('+2 💥',p.basket.wx,p.basket.wy,'#c79dff');burst(p.basket.wx,p.basket.wy,10,['#c9954f','#ff6b6b'],130,300,.5);SFX.smash();}
     const gt=p.gy-p.g/2,gb=p.gy+p.g/2;
     if((circRect(cx,cy,r,p.x,0,p.w,gt)||circRect(cx,cy,r,p.x,gb,p.w,GROUND-gb))&&Math.random()<.4)
       burst(cx,cy,4,RAINBOW,90,60,.4); }
   checkMilestone(); return; }
 if(cat.inv>0)return;
 for(const p of pairs){
   const gt=p.gy-p.g/2,gb=p.gy+p.g/2;
   if(circRect(cx,cy,r,p.x,0,p.w,gt)||circRect(cx,cy,r,p.x,gb,p.w,GROUND-gb))return hitObs(p,null);
   if(p.laundry)for(let i=0;i<3;i++){ const lx=p.x+p.w*(.2+.3*i);
     if(circRect(cx,cy,r,lx-7,gt+2,14,20))return hitObs(p,null); }
   if(p.dog){ const d=p.dog,dx=p.x+p.w*d.ox;
     const ext=(d.barkT>.1&&d.barkT<.5)?12:0;
     if(circRect(cx,cy,r,dx-16,gb-30-ext,32,30+ext))return hitObs(p,'dog'); }
   if(p.pot&&!p.pot.dead&&dist2(cx,cy,p.pot.wx,p.pot.wy)<(r+12)*(r+12))return hitObs(p,'pot');
   if(p.basket&&!p.basket.dead&&dist2(cx,cy,p.basket.wx,p.basket.wy)<(r+14)*(r+14))return hitObs(p,'basket');
 }
 for(const f of flyers){ if(f.dead)continue; let hit=false;
   if(f.type==='heli') hit=circRect(cx,cy,r,f.x-34,f.y-24,76,40);
   else if(f.type==='cloud') hit=dist2(cx,cy,f.x,f.y)<(r+20)*(r+20)||
     (f.state==='strike'&&circRect(cx,cy,r,f.x-9,f.y+10,18,140));
   else{ const rr=f.type==='ufo'?20:f.type==='balloon'?27:f.type==='kite'?15:13;
     const oy=f.type==='balloon'?-14:0;
     hit=dist2(cx,cy,f.x,f.y+oy)<(r+rr)*(r+rr); }
   if(hit)return hitObs(null,f.type,f); }
}

   runFish++; SFX.fish();

   if(fishTotal+runFish>=50&&store.get('pet','')===''){store.set('pet','1');showToast('🫧 سمكة رفيقة لحقت بكي!');}

 else if(pk.kind==='heart'){ cat.shield=true; SFX.power(); popup('درع! ❤️',pk.x,pk.y-18,'#ff9db1'); }
 else if(pk.kind==='bolt'){ cat.bolt=5; SFX.power(); popup('طاقة ×2 ⚡',pk.x,pk.y-18,'#ffd93d'); }
 else if(pk.kind==='wing'){ cat.wing=6; SFX.power(); popup('جناحات! 🪽',pk.x,pk.y-18,'#fff3dd'); }
 else if(pk.kind==='magnet'){ cat.magnet=8; SFX.power(); popup('مغناطيس 🧲',pk.x,pk.y-18,'#ff8f8f'); }
 else if(pk.kind==='star'){ cat.star=3.5; SFX.fanfare(); popup('نجمة! عدّي من كل حاجة ✨',pk.x,pk.y-18,'#c79dff'); }
 else if(pk.kind==='clock'){ slowmo=4; SFX.power(); popup('زمن بطيء ⏱',pk.x,pk.y-18,'#6bc1ff'); }
 else if(pk.kind==='milk'){ if(!cat.shield)cat.shield=true; score+=5;

}

// ==== التحديث ====
function update(dt){
 now+=dt;
 if(flashA>0)flashA-=dt*2.4;
 if(shakeT>0)shakeT-=dt;
 blinkT-=dt; if(blinkT<0)blinkT=rand(2.4,5);
 lerpLive(dt); updateParticles(dt);
 toasts.forEach(tt=>tt.t+=dt); toasts=toasts.filter(tt=>tt.t<4);
 if(banner){banner.t+=dt;if(banner.t>banner.tMax)banner=null;}
 if(bigPop){bigPop.t-=dt;if(bigPop.t<=0)bigPop=null;}
 if(bubble){bubble.t-=dt;if(bubble.t<=0)bubble=null;}
 if(charMsg){charMsg.t-=dt;if(charMsg.t<=0)charMsg=null;}
 // السمكة الرفيقة
 if(fishTotal>=50&&(state===ST.START||state===ST.PLAY||state===ST.DYING||state===ST.OVER)){
   pet.x+=(cat.x-46-pet.x)*Math.min(1,dt*3.2);
   pet.y+=(cat.y+16-pet.y)*Math.min(1,dt*3.2); }

 if(state===ST.START||state===ST.CHARS||state===ST.ACHS){
   spd=42; dist+=spd*dt;
   if(state===ST.START){ cat.y=88+Math.sin(now*1.8)*10; cat.a=0; cat.flap+=dt*10;
     if(!bubble&&Math.random()<dt*.12){bubble={s:pick(curChar().lines),t:3};} }
 } else if(state===ST.PLAY){ updatePlay(dt); }
 else if(state===ST.DYING){
   deathT+=dt; cat.vy+=GRV*1.15*dt; cat.y+=cat.vy*dt; cat.a+=7*dt;
   if(cat.y>GROUND-16){ cat.y=GROUND-16;
     if(!cat.landed){cat.landed=true;burst(cat.x,GROUND-8,10,['#cfc4ae','#8f8470'],110,300,.5);}
     cat.a=cat.a+(1.5-cat.a)*Math.min(1,dt*10); }
   if(deathT>.95){state=ST.OVER;overT=0;
     if(newBest)for(let i=0;i<40;i++)parts.push({x:rand(60,W-60),y:rand(150,300),
       vx:rand(-40,40),vy:rand(30,120),g:60,life:rand(1,2),t:0,
       c:pick(['#ffd84d','#ff5d73','#4ff0e0','#fff3dd','#ff4fd8']),s:randi(3,5)});}
 } else if(state===ST.OVER){ overT+=dt; }
}

function updatePlay(dt){
 const ch=curChar();
 const wdt=dt*(slowmo>0?.55:1); // الزمن البطيء
 slowmo=Math.max(0,slowmo-dt);
 spd=theme.speed*(1+loopN*.16)*(cat.bolt>0?1.4:1);
 dist+=spd*wdt;
 ensurePairs();
 // القطة
 const gmul=theme.grav*ch.grav*(cat.wing>0?.45:1);
 cat.vy=Math.min(cat.vy+GRV*gmul*wdt,MAXF);
 cat.y+=cat.vy*wdt;
 cat.q*=Math.exp(-dt*8);
 cat.flap+=dt*(cat.bolt>0?26:cat.wing>0?10:14);
 cat.inv=Math.max(0,cat.inv-dt);
 cat.bolt=Math.max(0,cat.bolt-dt);
 cat.wing=Math.max(0,cat.wing-dt);
 cat.magnet=Math.max(0,cat.magnet-dt);
 cat.star=Math.max(0,cat.star-dt);

function updateWeather(dt){

   STARS.forEach(s=>{s.x-=6*dt;if(s.x<0)s.x+=W;});

   if(r.y>GROUND){r.y=rand(-60,0);r.x=rand(0,W+80);}if(r.x<-10)r.x+=W+20;});
 if(theme.weather==='snow')SNOW.forEach(s=>{s.y+=s.s*dt;s.x+=Math.sin(now+s.ph)*14*dt-18*dt;
   if(s.y>GROUND){s.y=-8;s.x=rand(0,W);}if(s.x<-6)s.x+=W+12;});

}

function hitButtons(x,y){
 for(const b of BTNS){ if(!b.vis())continue; const g=b.geo();
  if(x>=g[0]&&x<=g[0]+g[2]&&y>=g[1]&&y<=g[1]+g[3]){
    press={id:b.id,t:.15};
    if(b.id==='pause')togglePause();
    else if(b.id==='mute'){SFX.on=!SFX.on;store.set('mute',SFX.on?'0':'1');}
    else if(b.id==='retry')startRun();
    else if(b.id==='home'||b.id==='quit')goHome();
    else if(b.id==='resume')togglePause();
    else if(b.id==='chars')goChars();
    else if(b.id==='achs')goAchs();
    else if(b.id==='back')goHome();
    else if(b.id==='cprev'){charIdx=(charIdx+CHARS.length-1)%CHARS.length;SFX.tick();}
    else if(b.id==='cnext'){charIdx=(charIdx+1)%CHARS.length;SFX.tick();}
    else if(b.id==='caction')charAction();
    return true; } }
 return false;
}

 ctx.drawImage(SPR.goldfish,W-132,24,22,15);
 dtext('×'+fishTotal,W-84,35,{f:'px',size:10});
 const c=CHARS[charIdx];
 ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(W/2-70,282,140,10);
 drawHero(c,W/2,216,120,now);
 dtext(c.name,W/2,326,{size:30,weight:800,soy:3});
 dtext(c.sp,W/2,358,{size:14,alpha:.75});
 dtext(c.perk,W/2,388,{size:14,color:'#ffd84d'});
 statRow('قوة النطة',(c.jump-.85)/.35,428);
 statRow('خفة الجسم',(1.25-c.grav)/.55,462);
 CHARS.forEach((cc,i)=>{ const x=W/2-(CHARS.length-1)*12+i*24;
  ctx.fillStyle=i===charIdx?'#f7a825':'#4a4176';
  ctx.fillRect(x-(i===charIdx?5:3),498,i===charIdx?10:6,i===charIdx?10:6); });
 if(charMsg)dtext(charMsg.s,W/2,H-104,{size:13,weight:700,
   color:owned.has(c.id)||fishTotal>=c.price?'#7ddb8a':'#ff9db1'});
 else if(c.id===selCharId)dtext('دي بطلكي الحالية',W/2,H-104,{size:12,alpha:.6});
 else if(!owned.has(c.id))dtext('السعر: '+c.price+' 🐟 — عندك '+fishTotal,W/2,H-104,{size:12,alpha:.6});
}
function drawAchsScreen(){
 ctx.fillStyle='rgba(10,8,20,.55)'; ctx.fillRect(0,0,W,H);
 dtext('الإنجازات',W/2,54,{size:24,weight:800,soy:3});
 dtext(achOwned.size+' / '+ACHS.length,W/2,86,{f:'px',size:10,color:'#ffd84d'});
 const ph=ACHS.length*46+18;
 cham(24,106,W-48,ph,12); ctx.fillStyle='rgba(22,17,38,.94)'; ctx.fill();
 ctx.strokeStyle='#4a4176'; ctx.lineWidth=2.5; ctx.stroke();
 ACHS.forEach((a,i)=>{ const y=124+i*46;
  dtext(a.icon,52,y,{size:17,shadow:null});
  dtext(a.name,215,y-8,{size:14,weight:700,
    color:achOwned.has(a.id)?'#fff':'#8a82aa'});
  dtext(a.desc,215,y+10,{size:11,weight:400,
    color:achOwned.has(a.id)?'#c9c2e0':'#5d5676'});
  if(achOwned.has(a.id)){ ctx.strokeStyle='#7ddb8a'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(W-56,y-4); ctx.lineTo(W-51,y+2); ctx.lineTo(W-42,y-10); ctx.stroke(); }
  else{ ctx.fillStyle='#4a4176';
    ctx.fillRect(W-52,y-8,12,9); cham(W-52,y-12,12,5,2); ctx.fill();
    ctx.fillRect(W-48,y+1,4,5); } });
}
function drawOverScreen(){
 ctx.fillStyle='rgba(10,8,20,.55)'; ctx.fillRect(0,0,W,H);
 const px=W/2-175,py2=130,pw=350,ph=486;
 cham(px,py2,pw,ph,14); ctx.fillStyle='rgba(22,17,38,.96)'; ctx.fill();
 ctx.lineWidth=3; ctx.strokeStyle='#f7a825'; ctx.stroke();
 ctx.drawImage(curChar().spr.dead,px+16,py2+16,44,33);
 dtext(overTitle,W/2+24,py2+40,{size:19,weight:800,soy:3});
 dtext('أرواح البطل: '+lives+'/9',W/2,py2+78,{size:14,weight:700,color:'#ff9db1'});
 if(livesJustReset)dtext('رجعت بـ٩ أرواح جداد! 😹',W/2,py2+100,{size:13,weight:700,color:'#ffd84d'});
 for(let i=0;i<9;i++){ const hx=W/2-103+i*24;
  if(i<lives)ctx.drawImage(SPR.heart,hx,py2+114,20,18);
  else{ ctx.save();ctx.globalAlpha=.22;ctx.drawImage(SPR.heart,hx,py2+114,20,18);ctx.restore(); } }
 dtext('SCORE',W/2,py2+168,{f:'px',size:10,alpha:.6});
 dtext(String(score),W/2,py2+206,{f:'px',size:34,soy:4});
 if(newBest&&Math.sin(now*6)>0)dtext('NEW BEST! ✨',W/2,py2+244,{f:'px',size:10,color:'#ffd84d'});
 dtext('BEST: '+best,W/2,py2+270,{f:'px',size:10,alpha:.8});
 ctx.drawImage(SPR.fish,W/2-52,py2+292,24,16);
 dtext('×'+runFish+'  (الإجمالي '+fishTotal+')',W/2+16,py2+301,{size:13,weight:700});
 dtext('وصلتي: '+theme.name,W/2,py2+330,{size:13,weight:600,alpha:.85});
 if(overT>1.1)dtext('دوسي Space أو ضغطي في أي حتة',W/2,py2+400,{size:12,alpha:.6});
}
function drawPauseScreen(){
 ctx.fillStyle='rgba(10,8,20,.6)'; ctx.fillRect(0,0,W,H);
 cham(W/2-130,H/2-120,260,240,14);
 ctx.fillStyle='rgba(22,17,38,.96)'; ctx.fill();
 ctx.lineWidth=3; ctx.strokeStyle='#f7a825'; ctx.stroke();
 ctx.drawImage(curChar().spr.idle,W/2-36,H/2-96,72,54);
 dtext('استراحة قطة 😺',W/2,H/2+6,{size:22,weight:800});
}
function drawToasts(){
 toasts.forEach((tt,i)=>{
  const dy=(1-Math.min(1,tt.t/.35))*-70;
  let a=1; if(tt.t<.35)a=tt.t/.35; if(tt.t>3.5)a=Math.max(0,(4-tt.t)/.5);
  ctx.save(); ctx.globalAlpha=a;
  const y=98+i*56+dy;
  cham(W/2-150,y-20,300,40,9); ctx.fillStyle='rgba(20,15,36,.92)'; ctx.fill();
  ctx.strokeStyle='#f7a825'; ctx.lineWidth=2; ctx.stroke();
  dtext(tt.s,W/2,y,{size:14,weight:700,shadow:null});
  ctx.restore(); });
}

// ==== الرندر ====
function render(){
 ctx.setTransform(RS,0,0,RS,0,0);
 ctx.fillStyle='#0f0c1d'; ctx.fillRect(0,0,W,H);
 ctx.save();
 if(shakeT>0&&state!==ST.START)
   ctx.translate(rand(-1,1)*shakeMag*shakeT,rand(-1,1)*shakeMag*shakeT);
 drawSky(); drawStars(); drawDeco(now); drawNile();
 drawLayer(FAR,.18,rgbStr(live.far)); drawPyramids();
 drawCars(); drawClouds();
 drawLayer(NEAR,.42,rgbStr(live.near)); drawNearDetail(); drawPalms();
 drawGround(now);
 pairs.forEach(p=>drawPair(p,now));
 drawPickups(now); drawFlyers(now); drawParticles();
 if(state===ST.PLAY||state===ST.DYING||state===ST.OVER||state===ST.PAUSE){ drawPlayer(now); drawPet(); }
 drawWeatherFX();
 if(rushT>0){ ctx.fillStyle='rgba(255,200,60,.10)'; ctx.fillRect(0,0,W,GROUND);
   if(Math.random()<.3)parts.push({x:rand(0,W),y:rand(0,GROUND-40),vx:-40,vy:rand(10,40),g:0,life:.8,t:0,c:'#ffe89a',s:3}); }
 if(slowmo>0){ ctx.fillStyle='rgba(90,140,255,.12)'; ctx.fillRect(0,0,W,H); }
 ctx.restore();
 if(flashA>0){ ctx.fillStyle='rgba(255,255,255,'+clamp(flashA,0,1)+')'; ctx.fillRect(0,0,W,H); }

 if(state===ST.PLAY||state===ST.DYING){ drawHUD(); drawPops(); }
 if(state===ST.PLAY&&bubble)drawBubbleAt(cat.x+34,cat.y-64);
 if(state===ST.PLAY&&!jumpedOnce&&games<=3)
   dtext('دوسي Space أو ضغطي عشان تطيري!',W/2,H*.72,{size:15,weight:700,color:'#ffd84d'});
 drawBanner(); drawBigPop();
 if(state===ST.START)drawStartScreen();
 if(state===ST.CHARS)drawCharsScreen();
 if(state===ST.ACHS)drawAchsScreen();
 if(state===ST.OVER)drawOverScreen();
 if(state===ST.PAUSE)drawPauseScreen();
 drawToasts();
 drawBtns();
}

// ==== الإدخال ====
function toWorld(e){ const r=cvs.getBoundingClientRect();
 return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}; }
function action(){ SFX.init();
 if(state===ST.START)startRun();
 else if(state===ST.PLAY)jump();
 else if(state===ST.OVER&&overT>1.1)startRun();
 else if(state===ST.CHARS)charAction();
 else if(state===ST.ACHS)goHome(); }
cvs.addEventListener('pointerdown',e=>{ e.preventDefault(); SFX.init();
 const p=toWorld(e); if(hitButtons(p.x,p.y))return;
 if(state===ST.CHARS){ if(p.x<W*.32){charIdx=(charIdx+CHARS.length-1)%CHARS.length;SFX.tick();}
   else if(p.x>W*.68){charIdx=(charIdx+1)%CHARS.length;SFX.tick();} return; }
 if(state===ST.ACHS)return;
 action(); },{passive:false});
cvs.addEventListener('pointermove',e=>{ const p=toWorld(e); mouse.x=p.x;mouse.y=p.y;mouse.in=true; });
cvs.addEventListener('pointerleave',()=>mouse.in=false);
cvs.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
 if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){ e.preventDefault(); if(!e.repeat){SFX.init();action();} }
 else if(e.code==='KeyP'||e.code==='Escape'){
   if(state===ST.CHARS||state===ST.ACHS)goHome();
   else if(state===ST.PLAY||state===ST.PAUSE)togglePause(); }
 else if(e.code==='KeyM'){ SFX.on=!SFX.on; store.set('mute',SFX.on?'0':'1'); }
 else if(state===ST.CHARS){
   if(e.code==='ArrowLeft'){charIdx=(charIdx+1)%CHARS.length;SFX.tick();}
   if(e.code==='ArrowRight'){charIdx=(charIdx+CHARS.length-1)%CHARS.length;SFX.tick();} }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state===ST.PLAY)togglePause(); });

// ==== أيقونة الموبايل ====
function makeIcon(){
 try{
  const c=document.createElement('canvas'); c.width=c.height=192;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
  ['#6fc0ec','#9cd6f3','#cdf0f9'].forEach((col,i)=>{g.fillStyle=col;g.fillRect(0,i*64,192,64);});
  g.fillStyle='#e8d5b0'; g.fillRect(8,120,44,72);
  g.fillStyle='#d9b988'; g.fillRect(70,96,50,96);
  g.fillStyle='#c9a06a'; g.fillRect(140,132,44,60);
  g.fillStyle='#8a6f4a';
  for(let r=0;r<3;r++)for(let cc=0;cc<2;cc++)g.fillRect(16+cc*18,110+r*18,10,12);
  for(let r=0;r<4;r++)for(let cc=0;cc<2;cc++)g.fillRect(80+cc*18,86+r*18,10,12);
  g.drawImage(CHARS[0].spr.idle,0,0,48,36,32,34,128,96);
  const url=c.toDataURL('image/png');
  [['apple-touch-icon',url],['icon',url]].forEach(l=>{
    const el=document.createElement('link'); el.rel=l[0]; el.href=l[1]; document.head.appendChild(el); });
  const man={name:'Catty City',short_name:'Catty City',start_url:'.',display:'standalone',
    background_color:'#100d1c',theme_color:'#161226',
    icons:[{src:url,sizes:'192x192',type:'image/png'}]};
  const ml=document.createElement('link'); ml.rel='manifest';
  ml.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/json'}));
  document.head.appendChild(ml);
 }catch(e){}
}

// ==== التشغيل ====
setTheme(LEVELS[0],true);
makeIcon();
if(document.fonts&&document.fonts.load){
 document.fonts.load('12px "Press Start 2P"'); document.fonts.load('800 20px Changa'); }
let last=0;
function frame(ts){ requestAnimationFrame(frame);
 const dt=Math.min(.033,((ts-last)||16)/1000); last=ts;
 if(press.t>0)press.t-=dt;
 update(dt); render();
}
requestAnimationFrame(frame);
</script>
