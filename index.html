const easeOutBack=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};

function spr(rows,pal,s){ s=s||PIX;

 const c=document.createElement('canvas'); c.width=w*s; c.height=h*s;
 const g=c.getContext('2d');
 rows.forEach((r,y)=>{ for(let x=0;x<r.length;x++){ const col=pal[r[x]];
   if(col){ g.fillStyle=col; g.fillRect(x*s,y*s,s,s); } } });
 return c;
}
function flipH(c){const n=document.createElement('canvas');n.width=c.width;n.height=c.height;
 const g=n.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return n;}

function bld(x,y,w,h,pal,isTop,seed,t){
 if(h<10)return;
 const rng=mulberry32(seed);
 ctx.fillStyle=pal.body; ctx.fillRect(x,y,w,h);
 ctx.fillStyle=pal.shade; ctx.fillRect(x+w-7,y,7,h);
 ctx.fillStyle=pal.trim; ctx.fillRect(x+3,y,3,h);
 ctx.fillStyle=pal.out; ctx.fillRect(x-3,y,3,h); ctx.fillRect(x+w,y,3,h);
 // الشبابيك
 const stepX=21,stepY=27,ww=12,wh=15;
 const cols=Math.max(1,Math.floor((w-10)/stepX));
 const rows=Math.max(1,Math.floor((h-22)/stepY));
 const mx=x+Math.floor((w-cols*ww-(cols-1)*(stepX-ww))/2)+3;
 const my0=isTop?y+10:y+12;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
   const wx=mx+c*stepX,wy=my0+r*stepY;
   if(wy+wh>y+h-4)continue;
   const lit=rng()<pal.lit;
   const col=lit?pal.litCols[(r*3+c+seed)%pal.litCols.length]:pal.win;
   ctx.fillStyle=pal.out; ctx.fillRect(wx-2,wy-2,ww+4,wh+4);
   ctx.fillStyle=col;
   if(pal.round){ctx.fillRect(wx,wy+2,ww,wh-4);ctx.fillRect(wx+2,wy,ww-4,wh);}
   else ctx.fillRect(wx,wy,ww,wh);
   if(lit){ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(wx+2,wy+2,4,4);}
 }
 // حافة السطح
 const ey=isTop?y+h:y-9;
 ctx.fillStyle=pal.shade; ctx.fillRect(x-6,ey,w+12,9);
 ctx.fillStyle=pal.out;
 ctx.fillRect(x-6,isTop?ey+9:ey-3,w+12,3);
 ctx.fillRect(x-6,ey,3,9); ctx.fillRect(x+w+3,ey,3,9);
 if(!isTop){
   if(theme.gtype==='snow'){ctx.fillStyle='#f4f9fd';ctx.fillRect(x-6,ey-3,w+12,4);}
   const pr=rng();
   if(pr<.3){ // خزان مياه
     ctx.fillStyle=pal.out; ctx.fillRect(x+w*.16,ey-24,22,15);
     ctx.fillStyle=pal.trim; ctx.fillRect(x+w*.16+3,ey-21,16,9);
     ctx.fillStyle=pal.out; ctx.fillRect(x+w*.16+3,ey-9,3,9); ctx.fillRect(x+w*.16+16,ey-9,3,9);
   }else if(pr<.55){ // أنتينا بلمبة حمرا
     ctx.fillStyle=pal.out; ctx.fillRect(x+w*.68,ey-30,3,30);
     ctx.fillStyle=Math.sin(t*4+seed)>0?'#ff5d5d':pal.shade;
     ctx.fillRect(x+w*.68-3,ey-36,9,6);
   }else if(pr<.8){ // تكييف
     ctx.fillStyle=pal.out; ctx.fillRect(x+w*.4,ey-13,17,11);
     ctx.fillStyle='#9aa3b0'; ctx.fillRect(x+w*.4+3,ey-10,11,5);
   }
 }else{ // سارية للعمارة المعلقة
   ctx.fillStyle=pal.shade;
   ctx.fillRect(x+w/2-13,y+h+9,26,7);
   ctx.fillRect(x+w/2-8,y+h+16,16,7);
   ctx.fillRect(x+w/2-3,y+h+23,6,9);
   ctx.fillStyle=Math.sin(t*5+seed)>0?'#ffd84d':pal.out;
   ctx.fillRect(x+w/2-4,y+h+32,8,6);
 }
}
function drawPair(p,t){
 const gt=p.gy-p.g/2, gb=p.gy+p.g/2, x=Math.round(p.x);
 bld(x,0,p.w,gt,p.pal,true,p.seed+1013,t);

 // غسيل منشور من العمارة العلوية
 if(p.laundry){ const cols=['#ff6b6b','#6bc1ff','#ffd84d','#7ddb8a','#ff9db1'];
   for(let i=0;i<3;i++){ const cx=x+p.w*(.2+.3*i);
     const sw=Math.sin(t*2+i*1.4+(p.seed%10))*.14;
     ctx.save(); ctx.translate(cx,gt); ctx.rotate(sw);
     ctx.fillStyle='#3a3a4a'; ctx.fillRect(-11,-4,22,4);
     ctx.fillStyle=cols[(p.seed+i)%5]; ctx.fillRect(-9,0,18,24);
     ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(-9,0,18,4);
     ctx.fillStyle='#3a3a4a'; ctx.fillRect(-9,-6,3,5); ctx.fillRect(6,-6,3,5);
     ctx.restore(); } }
 // كلب على السطح
 if(p.dog){ const d=p.dog, dx=x+p.w*d.ox, dy=gb;
   let off=0; if(d.barkT>0)off=-Math.sin((1-d.barkT/.6)*Math.PI)*9;
   ctx.fillStyle=p.pal.out; ctx.fillRect(dx-25,dy-9,50,3);

   if(d.barkT>.35)dtext('!',dx+24,dy-40+off,{f:'px',size:11,color:'#ff5d5d'}); }
 // أصيص بينزل
 if(p.pot&&!p.pot.dead){ const pt=p.pot;
   ctx.drawImage(SPR.pot,pt.wx-15,pt.wy-14,30,27); }
 // سلة غسيل بتنزل

   ctx.drawImage(SPR.basket,-18,-14,36,27); ctx.restore(); }
}

function collide(){
 const cx=cat.x,cy=cat.y,r=14;
 if(cy+r>GROUND){die();return;}
 if(cy<18){cat.y=18;cat.vy=Math.max(cat.vy,0);}
 if(cat.inv>0)return;
 for(const p of pairs){
   const gt=p.gy-p.g/2,gb=p.gy+p.g/2;
   if(circRect(cx,cy,r,p.x,0,p.w,gt)||circRect(cx,cy,r,p.x,gb,p.w,GROUND-gb))return hitObs(p,null);
   if(p.laundry)for(let i=0;i<3;i++){ const lx=p.x+p.w*(.2+.3*i);
     if(circRect(cx,cy,r,lx-7,gt+2,14,20))return hitObs(p,null); }
   if(p.dog){ const d=p.dog,dx=p.x+p.w*d.ox;
     const ext=(d.barkT>.1&&d.barkT<.5)?12:0;
     if(circRect(cx,cy,r,dx-16,gb-30-ext,32,30+ext))return hitObs(p,'dog'); }
   if(p.pot&&!p.pot.dead&&dist2(cx,cy,p.pot.wx,p.pot.wy)<(r+12)*(r+12))return hitObs(p,'pot');
   if(p.basket&&!p.basket.dead&&dist2(cx,cy,p.basket.wx,p.basket.wy)<(r+14)*(r+14))return hitObs(p,'basket');
 }
 for(const f of flyers){ if(f.dead)continue; const rr=f.type==='ufo'?20:13;
   if(dist2(cx,cy,f.x,f.y)<(r+rr)*(r+rr))return hitObs(null,f.type,f); }
}

function update(dt){
 now+=dt;
 if(flashA>0)flashA-=dt*2.4;
 if(shakeT>0)shakeT-=dt;
 if(blinkT<3e9)blinkT-=dt; if(blinkT<0)blinkT=rand(2.4,5);
 lerpLive(dt); updateParticles(dt);
 if(banner){banner.t+=dt;if(banner.t>banner.tMax)banner=null;}
 if(bigPop){bigPop.t-=dt;if(bigPop.t<=0)bigPop=null;}
 if(bubble){bubble.t-=dt;if(bubble.t<=0)bubble=null;}

 if(state===ST.START){
   spd=42; dist+=spd*dt;
   cat.y=88+Math.sin(now*1.8)*10; cat.a=0; cat.flap+=dt*10;
   if(!bubble&&Math.random()<dt*.12){bubble={s:pick(CAT_LINES),t:3};}
 } else if(state===ST.PLAY){ updatePlay(dt); }
 else if(state===ST.DYING){
   deathT+=dt; cat.vy+=GRV*1.15*dt; cat.y+=cat.vy*dt; cat.a+=7*dt;
   if(cat.y>GROUND-16){ cat.y=GROUND-16;

 ctx.fillStyle='#fff6e1'; ctx.beginPath();
 ctx.moveTo(x+8,y+bh-1); ctx.lineTo(x+22,y+bh-1); ctx.lineTo(x+2,y+bh+11);

// ==== لوجو البكسل (خط مرسوم خصيصًا) ====
const FONT5={
 C:[".####","#....","#....","#....",".####"],
 A:[".###.","#...#","#####","#...#","#...#"],
 T:["#####","..#..","..#..","..#..","..#.."],
 Y:["#...#","#...#",".###.","..#..","..#.."],
 I:["#####","..#..","..#..","..#..","#####"]};
function drawLogoWord(word,cx,y,s,t){
 const total=(word.length*6-1)*s; let x=cx-total/2;
 const pos=[];
 for(let i=0;i<word.length;i++){ pos.push({gl:FONT5[word[i]],x:x+i*6*s,bob:Math.sin(t*2.2+i*.7)*s*.4}); x+=0; }
 // الظل الأول
 pos.forEach(p=>{ if(!p.gl)return;
   for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(p.gl[r][c]==='#'){
     ctx.fillStyle='#241531'; ctx.fillRect(p.x+c*s+s*.35,y+p.bob+r*s+s*.35,s,s); } });
 // الحروف
 pos.forEach(p=>{ if(!p.gl)return;
   for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(p.gl[r][c]==='#'){
     ctx.fillStyle=r<3?'#ffd84d':'#f7a825';
     ctx.fillRect(p.x+c*s,y+p.bob+r*s,s,s); } });
}

// ==== أزرار ====
const mouse={x:0,y:0,in:false};
let press={id:null,t:0};
const BTNS=[
 {id:'mute',  vis:()=>true,                       geo:()=>[W-46,12,34,34]},
 {id:'pause', vis:()=>state===ST.PLAY,            geo:()=>[W-86,12,34,34]},
 {id:'retry', vis:()=>state===ST.OVER,            geo:()=>[W/2-92,H/2+118,184,46],pri:true,label:'العبي تاني 🐾'},
 {id:'home',  vis:()=>state===ST.OVER,            geo:()=>[W/2-72,H/2+174,144,40],label:'الرئيسية'},
 {id:'resume',vis:()=>state===ST.PAUSE,           geo:()=>[W/2-92,H/2-8,184,46],pri:true,label:'كمّلي اللعب'},
 {id:'quit',  vis:()=>state===ST.PAUSE,           geo:()=>[W/2-72,H/2+48,144,40],label:'الرئيسية'}
];
function drawBtns(){
 BTNS.forEach(b=>{ if(!b.vis())return;
  const g=b.geo(),x=g[0],y=g[1],w=g[2],h=g[3];
  const hov=mouse.in&&mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h;
  const act=hov||press.id===b.id;
  if(b.label){
   cham(x,y,w,h,8);
   ctx.fillStyle=act?(b.pri?'#ffc84d':'#3d3560'):(b.pri?'#f7a825':'#2e2749'); ctx.fill();
   ctx.fillStyle=act?'#ffe9ad':'#ffe08a'; if(b.pri)ctx.fillRect(x+10,y+3,w-20,3);
   ctx.fillStyle=act?'#b57e14':'#1c1733'; if(b.pri)ctx.fillRect(x+10,y+h-6,w-20,3);
   dtext(b.label,x+w/2,y+h/2+1,{size:16,weight:800,color:b.pri?'#2a1a12':'#fff3dd',shadow:null});
  }else{
   // زر أيقونة (صوت / وقفة)
   cham(x,y,w,h,6); ctx.fillStyle=act?'#3d3560':'rgba(22,17,38,.85)'; ctx.fill();
   ctx.lineWidth=2.5; ctx.strokeStyle='#f7a825'; ctx.stroke();
   if(b.id==='pause'){ ctx.fillStyle='#fff3dd';
     ctx.fillRect(x+10,y+9,5,16); ctx.fillRect(x+20,y+9,5,16); }
   else{ ctx.fillStyle='#fff3dd';
     ctx.fillRect(x+7,y+13,6,8); ctx.fillRect(x+13,y+10,4,14); ctx.fillRect(x+17,y+8,4,18);
     if(SFX.on){ ctx.fillRect(x+23,y+12,3,3); ctx.fillRect(x+26,y+10,3,7); }
     else{ ctx.strokeStyle='#ff5d73'; ctx.lineWidth=3; ctx.beginPath();
       ctx.moveTo(x+21,y+11); ctx.lineTo(x+29,y+23); ctx.moveTo(x+29,y+11); ctx.lineTo(x+21,y+23); ctx.stroke(); } }
  }});
}
function hitButtons(x,y){
 for(const b of BTNS){ if(!b.vis())continue; const g=b.geo();
  if(x>=g[0]&&x<=g[0]+g[2]&&y>=g[1]&&y<=g[1]+g[3]){
    press={id:b.id,t:.15};
    if(b.id==='pause')togglePause();
    else if(b.id==='mute'){SFX.on=!SFX.on;store.set('mute',SFX.on?'0':'1');}
    else if(b.id==='retry')startRun();
    else if(b.id==='home'||b.id==='quit')goHome();
    else if(b.id==='resume')togglePause();
    return true; } }
 return false;
}

// ==== الرندر الرئيسي ====
function render(){
 ctx.setTransform(RS,0,0,RS,0,0);
 ctx.fillStyle='#0f0c1d'; ctx.fillRect(0,0,W,H);
 ctx.save();
 if(shakeT>0&&state!==ST.START)
   ctx.translate(rand(-1,1)*shakeMag*shakeT,rand(-1,1)*shakeMag*shakeT);
 drawSky(); drawStars(); drawDeco(now); drawNile();
 drawLayer(FAR,.18,rgbStr(live.far)); drawPyramids();
 drawCars(); drawClouds();
 drawLayer(NEAR,.42,rgbStr(live.near)); drawNearDetail(); drawPalms();
 drawGround(now);
 pairs.forEach(p=>drawPair(p,now));
 drawPickups(now); drawFlyers(now); drawParticles();
 drawCatWorld(now);
 drawWeatherFX();
 ctx.restore();
 if(flashA>0){ ctx.fillStyle='rgba(255,255,255,'+clamp(flashA,0,1)+')'; ctx.fillRect(0,0,W,H); }

 if(state===ST.PLAY||state===ST.DYING){ drawHUD(); drawPops(); }
 if(state===ST.PLAY&&bubble)drawBubbleAt(cat.x+34,cat.y-64);
 if(state===ST.PLAY&&!jumpedOnce&&games<=3)
   dtext('دوسي Space أو ضغطي عشان تطيري!',W/2,H*.72,{size:15,weight:700,color:'#ffd84d'});
 drawBanner(); drawBigPop();
 if(state===ST.START)drawStartScreen();
 if(state===ST.OVER)drawOverScreen();
 if(state===ST.PAUSE)drawPauseScreen();
 drawBtns();
}

// ==== الإدخال ====
function toWorld(e){ const r=cvs.getBoundingClientRect();
 return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}; }
function action(){ SFX.init();
 if(state===ST.START)startRun();
 else if(state===ST.PLAY)jump();
 else if(state===ST.OVER&&overT>1.1)startRun(); }
cvs.addEventListener('pointerdown',e=>{ e.preventDefault(); SFX.init();
 const p=toWorld(e); if(hitButtons(p.x,p.y))return; action(); },{passive:false});
cvs.addEventListener('pointermove',e=>{ const p=toWorld(e); mouse.x=p.x;mouse.y=p.y;mouse.in=true; });
cvs.addEventListener('pointerleave',()=>mouse.in=false);
cvs.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
 if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){ e.preventDefault(); if(!e.repeat){SFX.init();action();} }
 else if(e.code==='KeyP'||e.code==='Escape'){ if(state===ST.PLAY||state===ST.PAUSE)togglePause(); }
 else if(e.code==='KeyM'){ SFX.on=!SFX.on; store.set('mute',SFX.on?'0':'1'); }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state===ST.PLAY)togglePause(); });

// ==== أيقونة الموبايل + manifest (تتولد وقت التشغيل) ====
function makeIcon(){
 try{
  const c=document.createElement('canvas'); c.width=c.height=192;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
  ['#6fc0ec','#9cd6f3','#cdf0f9'].forEach((col,i)=>{g.fillStyle=col;g.fillRect(0,i*64,192,64);});
  g.fillStyle='#e8d5b0'; g.fillRect(8,120,44,72);
  g.fillStyle='#d9b988'; g.fillRect(70,96,50,96);
  g.fillStyle='#c9a06a'; g.fillRect(140,132,44,60);
  g.fillStyle='#8a6f4a';
  for(let r=0;r<3;r++)for(let cc=0;cc<2;cc++)g.fillRect(16+cc*18,110+r*18,10,12);
  for(let r=0;r<4;r++)for(let cc=0;cc<2;cc++)g.fillRect(80+cc*18,86+r*18,10,12);
  g.drawImage(CAT_SPR.idle,0,0,48,36,32,34,128,96);
  const url=c.toDataURL('image/png');
  [['apple-touch-icon',url],['icon',url]].forEach(l=>{
    const el=document.createElement('link'); el.rel=l[0]; el.href=l[1]; document.head.appendChild(el); });
  const man={name:'Catty City',short_name:'Catty City',start_url:'.',display:'standalone',
    background_color:'#100d1c',theme_color:'#161226',
    icons:[{src:url,sizes:'192x192',type:'image/png'}]};
  const ml=document.createElement('link'); ml.rel='manifest';
  ml.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/json'}));
  document.head.appendChild(ml);
 }catch(e){}
}

// ==== التشغيل ====
setTheme(LEVELS[0],true);
makeIcon();
if(document.fonts&&document.fonts.load){
 document.fonts.load('12px "Press Start 2P"'); document.fonts.load('800 20px Changa'); }
let last=0;
function frame(ts){ requestAnimationFrame(frame);
 const dt=Math.min(.033,((ts-last)||16)/1000); last=ts;
 if(press.t>0)press.t-=dt;
 update(dt); render();
}
requestAnimationFrame(frame);
</script>
